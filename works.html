<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="works.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <main class="hero">
  
      <header class="hero__header">
        <a href="./indext.html" class="logo">MARRIET BENOIT</a>

  
        <nav class="nav">
            <a href="./indext.html">Home</a>
            <a href="./indext.html/#about">About</a>
          <a href="./indext.html/#stack">Stack</a>
          <a href="./indext.html/#contact">Contact</a>
        </nav>
      </header>

      <section class="hero__content">
  
        <p class="hero__eyebrow">
          Web Developer / Integrator
        </p>
  
        <h1 class="hero__title">
          Surfing through
          <span>design</span> and
          <span>code</span>.
        </h1>
  
      </section>
  
      <section class="album-section">

        <div class="border"></div>
      
        <section class="album">
      
          <div class="album__header">
            <span>Selected Work</span>
      
            <span class="album__counter">
              <span id="currentProject">01</span>
              /
              <span id="totalProjects">04</span>
            </span>
          </div>
      
      
          <div class="album__book">
      
            <!-- PREVIOUS -->
            <button
              class="album__prev"
              aria-label="Previous project"
            >
              ←
            </button>
      
      
            <!-- ALBUM -->
      
            <div class="album__stack">
      
              <!-- BACK PAGE -->
              <div class="album__page album__page--back">
      
                <div class="album__back-content">
                  <span>SELECTED WORK</span>
                </div>
      
              </div>
      
      
              <!-- CURRENT PAGE -->
              <article class="album__page album__page--current">
      
                <div class="album__page-content">
      
                  <div class="album__image">
                    <img
                      id="projectImage"
                      src="project-01.jpg"
                      alt="Project preview"
                    >
                  </div>
      
      
                  <div class="album__info">
      
                    <div class="album__project-meta">
      
                      <span
                        class="album__number"
                        id="projectNumber"
                      >
                        01
                      </span>
      
                      <span
                        class="album__category"
                        id="projectCategory"
                      >
                        WEB / DEVELOPMENT
                      </span>
      
                    </div>
      
      
                    <div class="album__details">
      
                      <h2 id="projectTitle">
                        Project Name
                      </h2>
      
                      <p id="projectDescription">
                        A short description of the project goes here.
                      </p>
      
                      <span
                        class="album__technologies"
                        id="projectTech"
                      >
                        React · Node · API
                      </span>
      
                    </div>
      
      
                    <a
                      href="#"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="album__repository"
                      id="projectRepository"
                    >
                      <span>View repository</span>
                      <span>↗</span>
                    </a>
      
                  </div>
      
                </div>
      
      
                <div class="album__year" id="projectYear">
                  2026
                </div>
      
              </article>
      
            </div>
      
      
            <!-- NEXT -->
            <button
              class="album__next"
              aria-label="Next project"
            >
              →
            </button>
      
          </div>
      
        </section>
      
        <div class="bottomBorder"></div>
      
      </section>
     

  

    </main>
  
  </body>
</html>
